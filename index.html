<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Athlyft - Social Platform for Athletes</title>
    <meta name="description" content="Connect with athletes, share your journey, and build your sports community" />
    <meta name="author" content="Athlyft" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet">

    <meta property="og:title" content="Athlyft - Social Platform for Athletes" />
    <meta property="og:description" content="Connect with athletes, share your journey, and build your sports community" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary" />

    <!-- Apply the saved theme before first paint to avoid a light/dark flash. -->
    <script>
      try {
        var savedTheme = localStorage.getItem('athlyft-theme');
        document.documentElement.setAttribute('data-theme', (savedTheme === 'dark' || savedTheme === 'sport') ? savedTheme : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
