<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Athylift — Support athletes, break financial barriers</title>
    <meta name="description" content="Athylift connects underprivileged athletes with donors who help fund equipment, coaching, training and academy fees." />
    <meta name="author" content="Athylift" />
    <meta name="theme-color" content="#0F1E3D" />
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <meta property="og:title" content="Athylift — Support athletes, break financial barriers" />

    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary" />

    <!-- Apply the saved theme before first paint to avoid a light/dark flash. -->
    <script>
      try {
        var savedTheme = localStorage.getItem('athlyft-theme');
        document.documentElement.setAttribute('data-theme', (savedTheme === 'dark' || savedTheme === 'sport') ? savedTheme : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
