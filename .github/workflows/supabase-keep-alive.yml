# Pings Supabase so the free-tier project is never paused for inactivity.
# Requires repository secrets SUPABASE_URL and SUPABASE_ANON_KEY
# (GitHub repo -> Settings -> Secrets and variables -> Actions).
name: Supabase keep-alive

on:
  schedule:
    # Every 2 days at 03:17 UTC (free projects pause after ~7 idle days).
    - cron: '17 3 */2 * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ping Supabase
        run: node scripts/keep-alive.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      # GitHub disables scheduled workflows in public repos after 60 days without activity.
      # Re-enabling the workflow resets that timer, so this job never switches itself off.
      - name: Keep this workflow enabled
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keep-alive.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
